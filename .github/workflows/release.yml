name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-cryptography libzstd1

      - name: Build .deb
        run: make deb

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
