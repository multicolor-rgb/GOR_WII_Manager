[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gor-wii-manager"
version = "0.6.2"
description = "Wii/GameCube (WBFS) game backup manager for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "GOR Wii Manager" }]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.gui-scripts]
gor-wii-manager = "gor_wii_manager.ui.app:main"

[project.scripts]
gor-wii-manager-cli = "gor_wii_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gor_wii_manager = ["ui/assets/*"]
